# 数据2（AIReduceNoise2）· 3D UNet · 128 窗口递归 round3（half -> full.dn_3d_128_r3）
# r3 目标 = r1/r2 处理结果的密度自适应混合（scripts/blend_dn_targets.py）：
#   键 = r2（full.dn_3d_128_r2）的 CT 值（μ 域），lo=0.2 / hi=0.4，smoothstep 平滑过渡；
#   v<=0.2 -> r1（保守），v>=0.4 -> r2（激进），中间平滑 crossfade（分水岭 0.3 -> w=0.5）。
#   目标 = r1 + w(r2)·(r2 - r1)，写 full.dn_3d_128_r3.raw 并注册进 manifest。
# 与 r1/r2 的唯一控制变量差异 = 监督目标（full.dn_3d_128_r2 -> full.dn_3d_128_r3）；
#   窗口/stride/patch 全同：窗口 128 层、stride=112（D 轴重叠 16 层）、patch 256×256、base16/d4、batch_size=1。
# 热启动 = r2 best.pt（runs/..._dn_3d_128_r2/best.pt），optimizer/scheduler 冷启动。
# 运行（服务器 192.168.36.102，卡 0）：
#   OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 /opt/anaconda3/envs/pytorch201/bin/python \
#     scripts/train_voxel.py --arch unet3d \
#     --config configs/1609v2_unet3d_h2f_128_dn_3d_128_r3.yaml \
#     --manifest /data/raid0/yyc/AIReduceNoise2/splits_1609v2.json \
#     --run-dir runs/1609v2_n2n_3d_h2f_128_dn_3d_128_r3 \
#     --init-weights runs/1609v2_n2n_3d_h2f_128_dn_3d_128_r2/best.pt
reconstruction:
  source_root: '/data/raid0/yyc/AIReduceNoise2'
  output_root: '/data/raid0/yyc/AIReduceNoise2/PDL'
  post_procs: ''
  dtype: float32
  link_mode: auto

data:
  manifest: /data/raid0/yyc/AIReduceNoise2/splits_1609v2.json
  metric_data_range: 4.0
  seed: 42
  augment: true
  # 递归 round3：监督目标换成 r1/r2 密度自适应混合结果 full.dn_3d_128_r3_blend
  mappings: [even->full.dn_3d_128_r3_blend, odd->full.dn_3d_128_r3_blend]
  voxel_depth: 128
  # D 轴窗口重叠 16 层（stride=112），与 r1/r2 基线一致
  stride: 112
  patch_size: 256

model:
  arch: unet3d
  in_channels: 1
  out_channels: 1
  base_channels: 16
  depth: 4
  residual: true

training:
  epochs: 100
  batch_size: 1
  learning_rate: 0.0001
  weight_decay: 0.00001
  num_workers: 8
  amp: true
  gradient_clip: 1.0
  patience: 15
  device: cuda:0
  run_dir: runs/1609v2_n2n_3d_h2f_128_dn_3d_128_r3
  plot_interval: 5
