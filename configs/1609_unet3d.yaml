# 数据1（AIReduceNoise）· 3D UNet · half->half N2N 自监督训练（实验）
# 数据：Mode2_1609/Mode3_1609 重建卷（/data/raid0/yyc/AIReduceNoise/，study 级 manifest splits_1609.json）
# 监督：N2N3DDataset 显式方向映射 even <-> odd（3D slab source + 同 D 维 3D target，整卷去噪）；
#       训练窗口按 start 枚举、stride=4 滑动取样（窗口重叠 12 层），end=start+16 不越界。
# 模型：UNet3D base16/depth4（固定 2x 池化，输出 D = 输入 D = voxel_depth）
# 运行（服务器 192.168.36.102，卡 1）：
#   /opt/anaconda3/envs/pytorch201/bin/python scripts/train_voxel.py \
#     --config configs/1609_unet3d.yaml \
#     --manifest /data/raid0/yyc/AIReduceNoise/splits_1609.json \
#     --run-dir runs/1609_n2n_3d
reconstruction:
  source_root: '/data/raid0/yyc/AIReduceNoise'
  output_root: '/data/raid0/yyc/AIReduceNoise/PDL'
  post_procs: ''
  dtype: float32
  link_mode: auto

data:
  manifest: /data/raid0/yyc/AIReduceNoise/splits_1609.json
  metric_data_range: 4.0
  seed: 42
  augment: true
  # 显式映射方向：even <-> odd 双向互监督（等价旧 supervision_mode: half_view_n2n）
  mappings: [even->odd, odd->even]
  # 切片层数（任意正整数，默认 16，需 >= 2^depth=16）：source/target 同为连续 D 张切片
  voxel_depth: 16
  # 训练窗口滑动步长（默认 4）：窗口重叠 = voxel_depth - stride 层，end=start+D 不越界
  stride: 4

model:
  arch: unet3d
  in_channels: 1
  out_channels: 1
  base_channels: 16
  depth: 4
  residual: true

training:
  epochs: 100
  batch_size: 2
  learning_rate: 0.0001
  weight_decay: 0.00001
  # 并行数据加载：多进程预取让数据加载与 GPU 计算重叠（消除 GPU 空等）。
  # 启动命令需配 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 防 worker 线程 oversubscribe。
  num_workers: 8
  amp: true
  gradient_clip: 1.0
  patience: 15
  device: cuda:1
  run_dir: runs/1609_n2n_3d
  history_metrics: true
  plot_interval: 5
