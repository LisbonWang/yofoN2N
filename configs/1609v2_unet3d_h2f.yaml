# 数据2（AIReduceNoise2，PWLS(0.01×亮场)+Hamming 窗重建）· 3D UNet · half->full 监督训练
# 数据：Mode2_1609/Mode3_1609 重建卷（/data/raid0/yyc/AIReduceNoise2/，study 级 manifest splits_1609v2.json）
# 监督：N2N3DDataset 显式方向映射 even/odd -> full（半视图 -> 全视图，有监督去噪）；
#       D 维前 identity_layers=2 层做恒等映射（连续性约束），窗口越界 source/target 均填 0。
# 模型：UNet3D base16/depth4（固定 2x 池化，输出 D = 输入 D = voxel_depth）
# 注意：全 360 层训练（每 study 全部切片都参与）。
# 运行（服务器 192.168.36.102，卡 3）：
#   /opt/anaconda3/envs/pytorch201/bin/python scripts/train_voxel.py \
#     --config configs/1609v2_unet3d_h2f.yaml \
#     --manifest /data/raid0/yyc/AIReduceNoise2/splits_1609v2.json \
#     --run-dir runs/1609v2_n2n_3d_h2f
reconstruction:
  source_root: '/data/raid0/yyc/AIReduceNoise2'
  output_root: '/data/raid0/yyc/AIReduceNoise2/PDL'
  post_procs: ''
  dtype: float32
  link_mode: auto

data:
  manifest: /data/raid0/yyc/AIReduceNoise2/splits_1609v2.json
  metric_data_range: 4.0
  seed: 42
  augment: true
  # 显式映射方向：even/odd -> full（半视图 -> 全视图，有监督）
  mappings: [even->full, odd->full]
  # 全 360 层训练：每 study 全部切片都参与
  # 切片层数（任意正整数，默认 22，需 >= 2^depth=16）：source/target 同为连续 D 张切片；
  # 推理滑窗步长 = D−identity_layers = 20，360 = 20×18 恰好对齐（零越界）。
  voxel_depth: 22
  # D 维前 identity_layers 层做恒等映射（连续性约束）：target=source、学 output==input；
  # 其余层正常监督；窗口越界（anchor 靠近卷首尾）时 source/target 均填 0。
  # 推理时丢弃这前 identity_layers 层（见 scripts/test_raw_3d.py）。
  identity_layers: 2

model:
  arch: unet3d
  in_channels: 1
  out_channels: 1
  base_channels: 16
  depth: 4
  residual: true

training:
  epochs: 100
  batch_size: 2
  learning_rate: 0.0001
  weight_decay: 0.00001
  # 并行数据加载：多进程预取让数据加载与 GPU 计算重叠（消除 GPU 空等）。
  # 启动命令需配 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 防 worker 线程 oversubscribe。
  num_workers: 8
  amp: true
  gradient_clip: 1.0
  patience: 15
  device: cuda:3
  run_dir: runs/1609v2_n2n_3d_h2f
  history_metrics: true
  plot_interval: 5
