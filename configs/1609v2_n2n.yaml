# 1609 视野 Noise2Noise 自监督训练配置（E1 修复版 v2，全 z 层覆盖）
# 相对 runs/1609_n2n (E1) 的两处修复（2026-09-07）：
#   1) 数据划分改为完全随机 train 90 / val 10 / test 10（splits_1609v2.json，
#      110 study = Mode2_1609×104 + Mode3_1609×6，不再强制 Mode3 全进 test；
#      test 10 = Mode2×8 + Mode3×2 —— 跨模式泛化评估由独立 test 卷部分承担）
#   2) 取消 max_slices_per_case 截断 —— 每 study 全部 360 层都参与训练
#      （旧版只取 z∈[0,120) 前 1/3 层，z≥120 的下颌/牙列段从未进过训练集）。
#      每 epoch 样本：90 study × 360 层 × 2 mapping = 64,800（旧版 19,920）
# 监督：even <-> odd（独立噪声对 Noise2Noise）
# 模型：UNet2D base16 depth3（与 E1 完全一致）
# 运行（服务器 192.168.36.102）：
#   CUDA_VISIBLE_DEVICES=N python scripts/train_sparse_dense.py \
#     --config configs/1609v2_n2n.yaml \
#     --manifest /data/raid0/yyc/AIReduceNoise/splits_1609v2.json \
#     --run-dir runs/1609v2_n2n
reconstruction:
  source_root: '/data/raid0/yyc/AIReduceNoise'
  output_root: '/data/raid0/yyc/AIReduceNoise/PDL'
  post_procs: ''
  dtype: float32
  link_mode: auto

data:
  manifest: /data/raid0/yyc/AIReduceNoise/splits_1609v2.json
  metric_data_range: 4.0
  seed: 42
  augment: true
  mappings: [even->odd, odd->even]
  # 2026-09-07 修复：不再设置 max_slices_per_case —— dataset 默认 None = 全层。
  # 旧版 120 只覆盖 z<120 前 1/3，删除本键后每 study 全 360 层进训练。
model:
  in_channels: 1
  out_channels: 1
  base_channels: 16
  depth: 3
  residual: true

training:
  epochs: 100
  batch_size: 2
  learning_rate: 0.0001
  weight_decay: 0.00001
  num_workers: 8
  amp: true
  gradient_clip: 1.0
  patience: 15
  device: cuda:0
  run_dir: runs/1609v2_n2n
  history_metrics: true
  plot_interval: 5
