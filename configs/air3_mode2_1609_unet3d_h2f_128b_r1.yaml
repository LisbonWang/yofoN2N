# AIReduceNoise3 · Mode2_1609 · four-domain joint training · 方案B r1b（blend-at-round-1）
# r1 监督目标 = full*(1-w) + M0(full)*w，w = smoothstep，μ∈[0.2,0.4] 对应 0→1（键 = M0 输出强度）：
#   软组织带（<=0.2）目标 = 原始 full（该带递归晚一轮启动），骨带（>=0.4）目标 = M0 输出。
# 目标生成（服务器 192.168.36.102，先 A 后 B，均为 train,val，test 永不进教师）：
#   A) M0(full)：scripts/prepare_full_dn_targets.py \
#        --config configs/air3_mode2_1609_unet3d_h2f_128_r0.yaml \
#        --manifest /data/raid0/yyc/AIReduceNoise3/splits_mode2_1609_balanced200_trainval.json \
#        --checkpoint runs/air3_mode2_1609_unet3d_h2f_128_r0/best.pt --arch unet3d \
#        --target-suffix dn_3d_128b_r0 --splits train,val --tiled --patch-hw 256 \
#        --overlap-d 16 --overlap-hw 16 --batch-size 2 --device cuda:0
#   B) 混合：scripts/blend_dn_targets.py \
#        --manifest <同上> --r1-suffix full --r2-suffix dn_3d_128b_r0 \
#        --target-suffix dn_3d_128b_r1 --lo 0.2 --hi 0.4 --kind smoothstep --splits train,val
# 启动（热启动 r0 best.pt，非 resume；opt/sched 冷启动）：
#   OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 /opt/anaconda3/envs/pytorch201/bin/python \
#     scripts/train_voxel.py --arch unet3d \
#     --config configs/air3_mode2_1609_unet3d_h2f_128b_r1.yaml \
#     --manifest /data/raid0/yyc/AIReduceNoise3/splits_mode2_1609_balanced200_trainval.json \
#     --run-dir runs/air3_mode2_1609_unet3d_h2f_128b_r1 \
#     --init-weights runs/air3_mode2_1609_unet3d_h2f_128_r0/best.pt
# 除监督目标与 run_dir 外，超参与 128_r0 完全一致（控制变量）。
reconstruction:
  source_root: '/data/raid0/yyc/AIReduceNoise3'
  output_root: '/data/raid0/yyc/AIReduceNoise3/PDL'
  post_procs: ''
  dtype: float32
  link_mode: auto

data:
  manifest: /data/raid0/yyc/AIReduceNoise3/splits_mode2_1609_balanced200_trainval.json
  metric_data_range: 4.0
  seed: 42
  augment: true
  # r1 监督：even/odd -> 混合目标 full.dn_3d_128b_r1（软组织=full，骨=M0 输出）
  mappings: [even->full.dn_3d_128b_r1, odd->full.dn_3d_128b_r1]
  residuals: [bhc, marfi]
  voxel_depth: 128
  stride: 112
  patch_size: 256

model:
  arch: unet3d
  in_channels: 1
  out_channels: 1
  base_channels: 16
  depth: 4
  residual: true

training:
  epochs: 100
  batch_size: 1
  learning_rate: 0.0001
  weight_decay: 0.00001
  num_workers: 8
  amp: true
  gradient_clip: 1.0
  patience: 5
  device: cuda:0
  run_dir: runs/air3_mode2_1609_unet3d_h2f_128b_r1
  plot_interval: 5
