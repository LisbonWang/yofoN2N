# 1609 视野 训练计划 C（E4）：half -> full_denoised（教师降噪目标）
# 数据：Mode2_1609 / Mode3_1609 重建卷（/data/raid0/yyc/AIReduceNoise/PDL/，
#       study 级 manifest /data/raid0/yyc/AIReduceNoise/splits_1609.json，与 E1 同划分）
# 思路（自蒸馏式目标升级）：
#   - 用当前最强模型（E2 half->full，runs/1609_fullview/best.pt）先对每个
#     train/val study 的 full.raw 做一次推理，产出 "full.dn.raw"（full 的降噪变体），
#     并注册进 manifest 的 outputs（key "full.dn.raw"，卷与 full.raw 同目录）。
#   - 训练映射 even->full.dn / odd->full.dn：把 half 视图直接回归到"被教师再降噪
#     过的 full"上，比回归原始 full（含与 half 相关的噪声）目标更干净。
#   - 数据集已支持 "full.*" 变体 target（n2n_dataset 向后兼容放宽），模型与
#     训练循环代码零改动。
# 生成目标卷（服务器）：
#   CUDA_VISIBLE_DEVICES=2 python scripts/prepare_full_dn_targets.py \
#     --checkpoint runs/1609_fullview/best.pt \
#     --manifest /data/raid0/yyc/AIReduceNoise/splits_1609.json --device cuda:0
# 运行（与 E2 同超参，控制变量只有监督目标）：
#   CUDA_VISIBLE_DEVICES=0 python scripts/train_sparse_dense.py \
#     --config configs/1609_fullview_dn.yaml \
#     --manifest /data/raid0/yyc/AIReduceNoise/splits_1609.json \
#     --run-dir runs/1609_fullview_dn
reconstruction:
  source_root: '/data/raid0/yyc/AIReduceNoise'
  output_root: '/data/raid0/yyc/AIReduceNoise/PDL'
  post_procs: ''
  dtype: float32
  link_mode: auto

data:
  manifest: /data/raid0/yyc/AIReduceNoise/splits_1609.json
  metric_data_range: 4.0
  seed: 42
  augment: true
  # 计划 C：仅 half -> full.dn 监督（full.dn = E2 对 full.raw 的降噪输出，
  # 两条方向同 epoch 混合；epoch 样本量与 E2 相同 = 19920）
  mappings: [even->full.dn, odd->full.dn]
  max_slices_per_case: 120

model:
  in_channels: 1
  out_channels: 1
  base_channels: 16
  depth: 3
  residual: true

training:
  epochs: 100
  batch_size: 2
  learning_rate: 0.0001
  weight_decay: 0.00001
  num_workers: 8
  amp: true
  gradient_clip: 1.0
  patience: 15
  device: cuda:0
  run_dir: runs/1609_fullview_dn
  history_metrics: true
  plot_interval: 5
