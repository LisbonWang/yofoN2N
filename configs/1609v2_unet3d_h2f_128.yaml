# 数据2（AIReduceNoise2，PWLS(0.01×亮场)+Hamming 窗重建）· 3D UNet · half->full 监督训练
# 128 窗口计划：切片平面 256×256 patch（从 640×640 裁剪，保持 0.25mm 体素分辨率）
#   + 深度 128 层窗口，D 轴相邻窗口重叠 16 层（stride=112）。
# 数据：Mode2_1609/Mode3_1609 重建卷（/data/raid0/yyc/AIReduceNoise2/，study 级 manifest splits_1609v2.json）
# 监督：N2N3DDataset 显式方向映射 even/odd -> full（半视图 -> 全视图，有监督去噪）。
# 模型：UNet3D base16/depth4（固定 2x 池化，D/H/W 三轴同步下采样，输出 D = 输入 D）。
#   注意 depth4 三轴感受野 RF=188；H/W=256 > 188 感受野完整，D=128 < 188 D 轴感受野被截断
#   （这是本计划 vs vd16 计划的已知 trade-off：D 轴上下文 16->128，但单次前向 D 感受野仍受窗口限制）。
# 运行（服务器 192.168.36.102，卡 0）：
#   OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 /opt/anaconda3/envs/pytorch201/bin/python \
#     scripts/train_voxel.py --arch unet3d \
#     --config configs/1609v2_unet3d_h2f_128.yaml \
#     --manifest /data/raid0/yyc/AIReduceNoise2/splits_1609v2.json \
#     --run-dir runs/1609v2_n2n_3d_h2f_128 \
#     --init-weights runs/1609v2_n2n_3d_h2f_v2_dn_3d_r0/best.pt
reconstruction:
  source_root: '/data/raid0/yyc/AIReduceNoise2'
  output_root: '/data/raid0/yyc/AIReduceNoise2/PDL'
  post_procs: ''
  dtype: float32
  link_mode: auto

data:
  manifest: /data/raid0/yyc/AIReduceNoise2/splits_1609v2.json
  metric_data_range: 4.0
  seed: 42
  augment: true
  # 显式映射方向：even/odd -> full（半视图 -> 全视图，有监督）
  mappings: [even->full, odd->full]
  # 切片层数（D 轴窗口深度）：128 层，需 >= 2^depth=16
  voxel_depth: 128
  # D 轴窗口滑动步长：128-16=112，相邻窗口重叠 16 层
  stride: 112
  # H/W 裁剪 patch 尺寸：从 640×640 裁 256×256（训练随机裁剪 / 验证中心裁剪）
  patch_size: 256

model:
  arch: unet3d
  in_channels: 1
  out_channels: 1
  base_channels: 16
  depth: 4
  residual: true

training:
  epochs: 100
  # D=128 窗口的 Level-0 特征图（128 层深）训练时激活显存爆炸，batch_size=1 才能
  # 在 24GB 卡上跑通（batch_size=2 实测 OOM：22.7 GiB 峰值）。GroupNorm 对 batch=1
  # 不敏感，不影响稳定性。
  batch_size: 1
  learning_rate: 0.0001
  weight_decay: 0.00001
  # 并行数据加载：多进程预取让数据加载与 GPU 计算重叠。
  # 启动命令需配 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 防 worker 线程 oversubscribe。
  num_workers: 8
  amp: true
  gradient_clip: 1.0
  patience: 5
  device: cuda:0
  run_dir: runs/1609v2_n2n_3d_h2f_128
  plot_interval: 5
