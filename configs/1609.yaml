# 1609 视野 Noise2Noise 自监督训练配置（主实验 E1）
# 数据：Mode2_1609 重建卷（/data/raid0/yyc/AIReduceNoise/PDL/，study 级 manifest /data/raid0/yyc/AIReduceNoise/splits_1609.json）
# 监督：N2NDataset 显式方向映射 even <-> odd（独立噪声对；与旧 supervision_mode: half_view_n2n 等价）
# 模型：base16 轻量（延续 base16 对比方向，1.94M 参数）
# 运行（服务器 192.168.36.102，卡 0）：
#   CUDA_VISIBLE_DEVICES=0 python scripts/train_sparse_dense.py \
#     --config configs/1609.yaml \
#     --manifest /data/raid0/yyc/AIReduceNoise/splits_1609.json \
#     --run-dir runs/1609_n2n
reconstruction:
  source_root: '/data/raid0/yyc/AIReduceNoise'
  output_root: '/data/raid0/yyc/AIReduceNoise/PDL'
  post_procs: ''
  dtype: float32
  link_mode: auto

data:
  manifest: /data/raid0/yyc/AIReduceNoise/splits_1609.json
  metric_data_range: 4.0
  seed: 42
  augment: true
  # N2NDataset 显式映射方向（多项并存、同 epoch 混合；等价于旧 half_view_n2n）
  mappings: [even->odd, odd->even]
  # 可选残差增强：base 样本保留、每个 tag 每层追加 1 样本；
  # 依赖 full.bhc / full.marfi / full.marfi.bhc 卷，bhc+marfi 同开时自动追加 marfibhc。
  # residuals: [bhc, marfi]
  max_slices_per_case: 120

model:
  in_channels: 1
  out_channels: 1
  base_channels: 16
  depth: 3
  residual: true

training:
  epochs: 100
  batch_size: 2
  learning_rate: 0.0001
  weight_decay: 0.00001
  num_workers: 0
  amp: true
  gradient_clip: 1.0
  patience: 15
  device: cuda:0
  run_dir: runs/1609_n2n
  history_metrics: true
  plot_interval: 5
