# AIReduceNoise3 Mode2_1609: distill the R0 -> N2N teacher chain.
# Generate full.by_r0.raw with the R0 checkpoint, then generate
# full.by_r0_by_n2n.raw by applying N2N to full.by_r0.raw.
# The student starts from scratch and matches the teacher architecture/capacity.
reconstruction:
  source_root: '/data/raid0/yyc/AIReduceNoise3'
  output_root: '/data/raid0/yyc/AIReduceNoise3/PDL'
  post_procs: ''
  dtype: float32
  link_mode: auto

data:
  manifest: /data/raid0/yyc/AIReduceNoise3/splits_mode2_1609_balanced200_trainval.json
  metric_data_range: 4.0
  seed: 42
  augment: true
  mappings: [full->full.by_r0_by_n2n]
  residuals: [bhc, marfi]
  voxel_depth: 128
  stride: 112
  patch_size: 256

model:
  arch: unet3d
  in_channels: 1
  out_channels: 1
  base_channels: 16
  depth: 4
  residual: true

training:
  epochs: 100
  batch_size: 1
  learning_rate: 0.0001
  weight_decay: 0.00001
  num_workers: 8
  amp: true
  gradient_clip: 1.0
  patience: 5
  device: cuda:0
  run_dir: runs/air3_mode2_1609_unet3d_fused
  plot_interval: 5
