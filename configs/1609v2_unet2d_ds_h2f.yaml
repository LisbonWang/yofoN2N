# 数据2（AIReduceNoise2，PWLS(0.01×亮场)+Hamming 窗重建）· 2D 深度可分离 UNet · half->full 监督训练
# 数据：Mode2_1609/Mode3_1609 重建卷（/data/raid0/yyc/AIReduceNoise2/，study 级 manifest splits_1609v2.json）
# 监督：N2NDataset 显式方向映射 even/odd -> full（半视图 -> 全视图，有监督去噪），slice 级逐层训练。
# 模型：UNet2D_DS base16/depth4（深度可分离 2D UNet，~473K 参数 / ~6.9G MACs @640×640）。
# 运行（服务器 192.168.36.102，卡 3）：
#   OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 /opt/anaconda3/envs/pytorch201/bin/python \
#     scripts/train_sparse_dense.py --arch unet2d_ds \
#     --config configs/1609v2_unet2d_ds_h2f.yaml \
#     --manifest /data/raid0/yyc/AIReduceNoise2/splits_1609v2.json \
#     --run-dir runs/1609v2_n2n_2d_ds_h2f
reconstruction:
  source_root: '/data/raid0/yyc/AIReduceNoise2'
  output_root: '/data/raid0/yyc/AIReduceNoise2/PDL'
  post_procs: ''
  dtype: float32
  link_mode: auto

data:
  manifest: /data/raid0/yyc/AIReduceNoise2/splits_1609v2.json
  metric_data_range: 4.0
  seed: 42
  augment: true
  # 显式映射方向：even/odd -> full（半视图 -> 全视图，有监督）
  mappings: [even->full, odd->full]

model:
  arch: unet2d_ds
  in_channels: 1
  out_channels: 1
  base_channels: 16
  depth: 4
  residual: true

training:
  epochs: 100
  batch_size: 8
  learning_rate: 0.0001
  weight_decay: 0.00001
  # 并行数据加载：多进程预取让数据加载与 GPU 计算重叠。
  # 启动命令需配 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 防 worker 线程 oversubscribe。
  num_workers: 8
  amp: true
  gradient_clip: 1.0
  patience: 15
  device: cuda:3
  run_dir: runs/1609v2_n2n_2d_ds_h2f
  plot_interval: 5
