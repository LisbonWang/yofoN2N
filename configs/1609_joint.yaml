# 1609 视野 联合监督训练配置（计划 B：half<->half + half->full，E3）
# 数据：与 E1 同一 manifest / 同一 study 划分（splits_1609.json，seed 42）
# 监督：N2NDataset 四条显式方向映射同 epoch 等权混合：
#   even->odd / odd->even  —— Noise2Noise 互监督（独立噪声对，可完全平均）
#   even->full / odd->full  —— full 弱监督（低噪声目标，学 half->full 系统校正）
#   二者同 batch 流混合，模型对两条监督取同一像素 L1（当前训练脚本统一 L1，
#   即等权联合；如需 λ 加权需改 train 脚本）。
# 注意：每 epoch 样本数为 E1 的 2 倍（4 条映射 × 切片数），wall time 近似翻倍。
# 模型：UNet2D base16（与 E1 完全一致，代码零改动）
# 运行（服务器 192.168.36.102，卡 0）：
#   CUDA_VISIBLE_DEVICES=0 python scripts/train_sparse_dense.py \
#     --config configs/1609_joint.yaml \
#     --manifest /data/raid0/yyc/AIReduceNoise/splits_1609.json \
#     --run-dir runs/1609_joint
reconstruction:
  source_root: '/data/raid0/yyc/AIReduceNoise'
  output_root: '/data/raid0/yyc/AIReduceNoise/PDL'
  post_procs: ''
  dtype: float32
  link_mode: auto

data:
  manifest: /data/raid0/yyc/AIReduceNoise/splits_1609.json
  metric_data_range: 4.0
  seed: 42
  augment: true
  # 计划 B：N2N 互监督 + full 弱监督 联合（四条方向同 epoch 混合）
  mappings: [even->odd, odd->even, even->full, odd->full]
  # 可选残差增强：与 E1 保持一致暂不开启（base 样本保留、每 tag 每层追加 1 样本）
  # residuals: [bhc, marfi]
  max_slices_per_case: 120

model:
  in_channels: 1
  out_channels: 1
  base_channels: 16
  depth: 3
  residual: true

training:
  epochs: 100
  batch_size: 2
  learning_rate: 0.0001
  weight_decay: 0.00001
  num_workers: 0
  amp: true
  gradient_clip: 1.0
  patience: 15
  device: cuda:0
  run_dir: runs/1609_joint
  history_metrics: true
  plot_interval: 5
