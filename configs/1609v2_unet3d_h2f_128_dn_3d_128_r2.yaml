# 数据2（AIReduceNoise2）· 3D UNet · 128 窗口递归 round2（half -> full.dn_3d_128_r2）
# 教师 = 128 窗口 r1（runs/1609v2_n2n_3d_h2f_128_dn_3d_128_r1/best.pt，ep79 val_l1=0.008841），
#   对 full 做 tiled 降噪得到 full.dn_3d_128_r2，然后热启动训练 even/odd -> full.dn_3d_128_r2。
# 与 r1 的唯一控制变量差异 = 监督目标（full.dn_3d_128_r1 -> full.dn_3d_128_r2）；
#   窗口/stride/patch 全同：窗口 128 层、stride=112（D 轴重叠 16 层）、patch 256×256、base16/d4、batch_size=1。
# 运行（服务器 192.168.36.102，卡 0）：
#   OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 /opt/anaconda3/envs/pytorch201/bin/python \
#     scripts/train_voxel.py --arch unet3d \
#     --config configs/1609v2_unet3d_h2f_128_dn_3d_128_r2.yaml \
#     --manifest /data/raid0/yyc/AIReduceNoise2/splits_1609v2.json \
#     --run-dir runs/1609v2_n2n_3d_h2f_128_dn_3d_128_r2 \
#     --init-weights runs/1609v2_n2n_3d_h2f_128_dn_3d_128_r1/best.pt
reconstruction:
  source_root: '/data/raid0/yyc/AIReduceNoise2'
  output_root: '/data/raid0/yyc/AIReduceNoise2/PDL'
  post_procs: ''
  dtype: float32
  link_mode: auto

data:
  manifest: /data/raid0/yyc/AIReduceNoise2/splits_1609v2.json
  metric_data_range: 4.0
  seed: 42
  augment: true
  # 递归 round2：监督目标换成 r1 降噪后的 full.dn_3d_128_r2
  mappings: [even->full.dn_3d_128_r2, odd->full.dn_3d_128_r2]
  voxel_depth: 128
  # D 轴窗口重叠 16 层（stride=112），与 r1 基线一致
  stride: 112
  patch_size: 256

model:
  arch: unet3d
  in_channels: 1
  out_channels: 1
  base_channels: 16
  depth: 4
  residual: true

training:
  epochs: 100
  batch_size: 1
  learning_rate: 0.0001
  weight_decay: 0.00001
  num_workers: 8
  amp: true
  gradient_clip: 1.0
  patience: 15
  device: cuda:0
  run_dir: runs/1609v2_n2n_3d_h2f_128_dn_3d_128_r2
  plot_interval: 5
