reconstruction:
  source_root: 'Z:\raid5\共享数据\典型图像\长安管口-PDL'
  output_root: 'Z:\raid5\共享数据\典型图像\长安管口-PDL-N2N-Pairs'
  xday_dir: 'D:\XDay Release\XDay617.2'
  post_procs: ''
  dtype: float32
  link_mode: auto
  per_view_files:
    projectionMatrix.bin: 84

data:
  manifest: outputs/splits.json
  metric_data_range: 4.0
  split_ratios: [0.8, 0.1, 0.1]
  seed: 42
  augment: true
  supervision_mode: full_view

model:
  in_channels: 1
  out_channels: 1
  base_channels: 32
  depth: 4
  residual: true

training:
  epochs: 100
  batch_size: 2
  learning_rate: 0.0001
  weight_decay: 0.00001
  num_workers: 0
  amp: true
  gradient_clip: 1.0
  patience: 15
  device: cuda
  run_dir: runs/default
  history_metrics: true
  plot_interval: 5
