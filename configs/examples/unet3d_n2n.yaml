# Portable 3D half-view Noise2Noise example. Supply the manifest at launch.
reconstruction:
  source_root: ./data
  output_root: ./data/reconstructed
  post_procs: ""
  dtype: float32
  link_mode: auto

data:
  manifest: ./data/manifest.json
  metric_data_range: 1.0
  seed: 42
  augment: true
  mappings: [even->odd, odd->even]
  residuals: []
  voxel_depth: 64
  stride: 32
  patch_size: 256

model:
  arch: unet3d
  in_channels: 1
  out_channels: 1
  base_channels: 8
  depth: 3
  residual: true

training:
  epochs: 100
  batch_size: 1
  learning_rate: 0.0001
  weight_decay: 0.00001
  num_workers: 4
  amp: true
  gradient_clip: 1.0
  patience: 10
  device: cuda
  run_dir: runs/example-unet3d-n2n
  plot_interval: 5
